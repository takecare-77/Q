<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendStore - Fashion & Accessories</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#232f3e">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #fff; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #shop-section { width: 100%; max-width: 480px; display: flex; flex-direction: column; min-height: 100vh; }
        .top-bar { background: #232f3e; color: #fff; padding: 15px; font-size: 18px; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .search-container { padding: 10px; background: #eaeded; display: flex; gap: 5px; }
        .search-container input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .search-container button { background: #febd69; border: 1px solid #a88734; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .shop-content { padding: 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; overflow-y: auto; }
        .product-card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .product-card h3 { font-size: 15px; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .product-card a { display: inline-block; background: #ffd814; color: #000; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }

        .auth-section { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; padding: 20px; background: #111b21; color: #fff; }
        .auth-box { background: #202c33; padding: 30px; border-radius: 10px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .auth-box input { padding: 12px; border-radius: 5px; border: none; background: #2a3942; color: #fff; font-size: 16px; outline: none; }
        .auth-box button { padding: 12px; border-radius: 5px; border: none; background: #00a884; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }

        #chat-section { display: none; width: 100%; max-width: 480px; height: 100vh; flex-direction: column; background: #0b141a; color: #fff; }
        .chat-header { height: 60px; background: #202c33; display: flex; align-items: center; padding: 0 15px; font-weight: bold; font-size: 18px; border-bottom: 1px solid #222d34; justify-content: space-between; }
        #messages, #vaultMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; cursor: pointer; position: relative; }
        .msg.sent { background: #005c4b; align-self: flex-end; }
        .msg.received { background: #202c33; align-self: flex-start; }
        .msg img, .msg video { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid #00a884; padding: 4px 8px; font-size: 12px; margin-bottom: 4px; border-radius: 4px; color: #d1d7db; }

        .chat-footer { padding: 10px; background: #202c33; display: flex; flex-direction: column; gap: 5px; }
        .reply-preview-box { display: none; background: #111b21; padding: 6px 10px; border-radius: 6px; font-size: 12px; justify-content: space-between; align-items: center; color: #00a884; }
        .footer-row { display: flex; gap: 8px; align-items: center; }
        .chat-footer input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; }
        .attach-btn, .call-btn { background: none; border: none; color: #8696a0; font-size: 18px; cursor: pointer; }
        .chat-footer button.send-btn { background: #00a884; border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="shop-section">
        <div class="top-bar">
            <span>✨ TrendStore Women & Fashion</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Kurti, Bracelets, Makeup..." onkeypress="handleSearchKey(event)">
            <button onclick="handleSearch()">Search</button>
        </div>
        <div class="shop-content">
            <h2>Trending Women's Collection & Accessories</h2>
            <div id="productGrid" style="display: flex; flex-direction: column; gap: 15px;">
                <p style="text-align:center; color:#666; margin-top:20px;">Loading 300+ unique fashion items...</p>
            </div>
        </div>
    </div>

    <div id="login-section" class="auth-section">
        <div class="auth-box">
            <h2>Secure Access</h2>
            <input type="text" id="usernameInput" placeholder="Username (user1 / user2)">
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="login()">Enter Chat</button>
        </div>
    </div>

    <div id="vaultLoginSection" class="auth-section">
        <div class="auth-box">
            <h2>Vault History PIN</h2>
            <input type="password" id="vaultPinInput" placeholder="Enter PIN (1717)">
            <button onclick="openVault()">Unlock Vault</button>
        </div>
    </div>

    <div id="chat-section">
        <div class="chat-header">
            <span id="roomTitle">Secure Chat</span>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span class="call-btn" onclick="startCall('video')" title="Video Call">📹</span>
                <span class="call-btn" onclick="startCall('audio')" title="Voice Call">📞</span>
                <span onclick="lockApp()" style="cursor: pointer; font-size: 14px; color: #8696a0;">Lock</span>
            </div>
        </div>
        <div id="messages" onscroll="checkPrivacyScroll(event)"></div>
        
        <div class="chat-footer">
            <div id="replyPreview" class="reply-preview-box">
                <span id="replyTextSnippet">Replying to message</span>
                <span onclick="cancelReply()" style="cursor:pointer; font-weight:bold;">✕</span>
            </div>
            <div class="footer-row">
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">
                <button class="attach-btn" onclick="document.getElementById('mediaInput').click()">📎</button>
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleChatKey(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <div id="callScreen" style="display: none; position: fixed; inset: 0; background: #0b141a; z-index: 100; flex-direction: column; justify-content: center; align-items: center;">
        <div style="position: relative; width: 100%; max-width: 400px; height: 60vh; background: #000; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center;">
            <video id="remoteVideo" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            <video id="localVideo" autoplay playsinline muted style="position: absolute; bottom: 10px; right: 10px; width: 100px; height: 140px; object-fit: cover; border-radius: 6px; border: 2px solid #fff;"></video>
        </div>
        <button onclick="endCall()" style="margin-top: 20px; background: #ea4335; color: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer;">End Call</button>
    </div>

    <div id="vaultSection" style="display: none; width: 100%; max-width: 480px; height: 100vh; flex-direction: column; background: #0b141a; color: #fff;">
        <div class="chat-header">
            <span>Deleted / Vault History</span>
            <span onclick="lockApp()" style="cursor: pointer; font-size: 14px; color: #8696a0;">Close</span>
        </div>
        <div id="vaultMessages"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = '';
        let selectedFile = null;
        let selectedFileType = null;
        let currentReplyId = null;
        let peerConnection;
        let localStream;
        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function loadLiveProducts() {
            try {
                const categories = ['womens-dresses', 'womens-jewellery', 'womens-bags', 'womens-shoes', 'beauty', 'tops', 'sunglasses', 'womens-watches'];
                let allProducts = [];
                let uniqueIds = new Set();

                for (let cat of categories) {
                    const res = await fetch(`https://dummyjson.com/products/category/${cat}?limit=50`);
                    const data = await res.json();
                    data.products.forEach(p => {
                        if (!uniqueIds.has(p.id)) {
                            uniqueIds.add(p.id);
                            allProducts.push(p);
                        }
                    });
                }

                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';

                allProducts.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${product.thumbnail}" alt="${product.title}" style="width:100px; height:100px; object-fit:contain; margin-bottom:8px;">
                        <h3>${product.title}</h3>
                        <a href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(product.title)}" target="_blank">🔗 View on Google Shop / Meesho / Flipkart</a>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        window.onload = function() {
            loadLiveProducts();
        };

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const searchInput = document.getElementById('searchInput');

            if (query === 't9') {
                document.getElementById('shop-section').style.display = 'none';
                document.getElementById('login-section').style.display = 'flex';
                searchInput.value = '';
            } else if (query === 'history') {
                document.getElementById('shop-section').style.display = 'none';
                document.getElementById('vaultLoginSection').style.display = 'flex';
                searchInput.value = '';
            } else if (query) {
                window.open(`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(query)}`, '_blank');
            }
        }

        function handleSearchKey(e) {
            if (e.key === 'Enter') handleSearch();
        }

        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if ((username === 'user1' && password === 'pass123') || (username === 'user2' && password === 'pass456')) {
                currentUser = username;
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('chat-section').style.display = 'flex';
                document.getElementById('roomTitle').innerText = `Chat (${currentUser})`;
                socket.emit('joinRoom', currentUser);
            } else {
                alert('Invalid Username or Password!');
            }
        }

        function openVault() {
            const pin = document.getElementById('vaultPinInput').value.trim();
            if (pin === '1717') {
                document.getElementById('vaultLoginSection').style.display = 'none';
                document.getElementById('vaultSection').style.display = 'flex';
                document.getElementById('vaultPinInput').value = ''; // Blank out pin box
                socket.emit('requestVaultHistory');
            } else {
                alert('Incorrect PIN! Try 1717');
                document.getElementById('vaultPinInput').value = '';
            }
        }

        function lockApp() {
            document.getElementById('chat-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('vaultLoginSection').style.display = 'none';
            document.getElementById('vaultSection').style.display = 'none';
            document.getElementById('shop-section').style.display = 'flex';
            endCall();
        }

        let lastScrollTop = 0;
        function checkPrivacyScroll(e) {
            const container = e.target;
            if (Math.abs(container.scrollTop - lastScrollTop) > 80) {
                lockApp();
            }
            lastScrollTop = container.scrollTop;
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                selectedFile = uploadEvent.target.result;
                selectedFileType = file.type.startsWith('image') ? 'image' : 'video';
                
                socket.emit('chatMessage', {
                    user: currentUser,
                    text: '',
                    fileType: selectedFileType,
                    fileData: selectedFile,
                    replyTo: currentReplyId
                });
                cancelReply();
                selectedFile = null;
                selectedFileType = null;
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            socket.emit('chatMessage', {
                user: currentUser,
                text: text,
                fileType: selectedFileType,
                fileData: selectedFile,
                replyTo: currentReplyId
            });

            input.value = '';
            cancelReply();
            selectedFile = null;
            selectedFileType = null;
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function setReply(msgId, snippetText) {
            currentReplyId = msgId;
            document.getElementById('replyTextSnippet').innerText = `Replying to: ${snippetText}`;
            document.getElementById('replyPreview').style.display = 'flex';
        }

        function cancelReply() {
            currentReplyId = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        function showMessageOptions(msgId, sender, text) {
            const choice = prompt("Select Action:\n1. Reply\n2. Add Reaction (❤️, 👍, 😂)\n3. Edit Message (Own only)\n4. Delete Message (Own only)");
            if (choice === "1") {
                setReply(msgId, text || "Media");
            } else if (choice === "2") {
                const reaction = prompt("Enter Emoji Reaction (❤️, 👍, 😂, 🔥):");
                if (reaction) socket.emit('addReaction', { id: msgId, reaction });
            } else if (choice === "3" && sender === currentUser) {
                const newText = prompt("Edit text:", text);
                if (newText) socket.emit('editMessage', { id: msgId, newText });
            } else if (choice === "4" && sender === currentUser) {
                socket.emit('deleteMessage', { id: msgId });
            }
        }

        socket.on('messageDeleted', (msgId) => {
            const el = document.getElementById(msgId);
            if (el) el.remove();
        });

        socket.on('messageEdited', (data) => {
            const el = document.getElementById(data.id);
            if (el) {
                const textSpan = el.querySelector('.msg-text');
                if (textSpan) textSpan.innerText = data.newText + " (edited)";
            }
        });

        socket.on('messageReaction', (data) => {
            const el = document.getElementById(data.id);
            if (el) {
                let reactSpan = el.querySelector('.reaction-badge');
                if (!reactSpan) {
                    reactSpan = document.createElement('div');
                    reactSpan.className = 'reaction-badge';
                    reactSpan.style.cssText = "position:absolute; bottom:-8px; right:8px; background:#202c33; padding:2px 6px; border-radius:10px; font-size:12px;";
                    el.appendChild(reactSpan);
                }
                reactSpan.innerText = data.reaction;
            }
        });

        async function startCall(type) {
            document.getElementById('callScreen').style.display = 'flex';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: type === 'video', 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(servers);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) socket.emit('candidate', event.candidate);
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', offer);
            } catch (error) {
                alert('Camera/Microphone permission denied.');
                endCall();
            }
        }

        socket.on('offer', async (offer) => {
            document.getElementById('callScreen').style.display = 'flex';
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('candidate', event.candidate);
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        socket.on('answer', async (answer) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('candidate', async (candidate) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        function endCall() {
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peerConnection) peerConnection.close();
            document.getElementById('callScreen').style.display = 'none';
        }

        socket.on('message', (msg) => {
            appendMessage(msg, 'messages');
        });

        socket.on('initialLiveMessages', (messages) => {
            const msgContainer = document.getElementById('messages');
            msgContainer.innerHTML = '';
            messages.forEach(msg => appendMessage(msg, 'messages'));
        });

        socket.on('vaultHistoryData', (messages) => {
            const vaultContainer = document.getElementById('vaultMessages');
            vaultContainer.innerHTML = '';
            if (messages.length === 0) {
                vaultContainer.innerHTML = '<p style="color:#8696a0; text-align:center; margin-top:20px;">No history found.</p>';
                return;
            }
            messages.forEach(msg => appendMessage(msg, 'vaultMessages'));
        });

        function appendMessage(msg, containerId) {
            const targetContainer = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `msg ${msg.user === currentUser ? 'sent' : 'received'}`;
            div.id = msg.id;
            
            div.onclick = () => showMessageOptions(msg.id, msg.user, msg.text);

            let content = '';
            if (msg.replyTo) {
                content += `<div class="reply-quote">Replying to message</div>`;
            }
            content += `<b>${msg.user}</b><br>`;
            if (msg.text) {
                content += `<span class="msg-text">${msg.text}</span><br>`;
            }
            if (msg.fileType === 'image' && msg.fileData) {
                content += `<img src="${msg.fileData}" alt="Image">`;
            } else if (msg.fileType === 'video' && msg.fileData) {
                content += `<video controls src="${msg.fileData}"></video>`;
            }
            
            const ticks = msg.user === currentUser ? '<span style="color: #53bdeb; margin-left:4px;">✓✓</span>' : '';
            content += `<div style="font-size:9px; float:right; color:#8696a0; margin-top:5px; margin-left:10px;">${msg.time} ${ticks}</div>`;
            
            if (msg.reaction) {
                content += `<div class="reaction-badge" style="position:absolute; bottom:-8px; right:8px; background:#202c33; padding:2px 6px; border-radius:10px; font-size:12px;">${msg.reaction}</div>`;
            }

            div.innerHTML = content;
            targetContainer.appendChild(div);
            targetContainer.scrollTop = targetContainer.scrollHeight;
        }
    </script>
</body>
</html>
