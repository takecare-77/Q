<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendStore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #111b21; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #shop-view { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding-bottom: 30px; color: #222; }
        .top-navbar { background: #9c27b0; color: #fff; padding: 12px; position: sticky; top: 0; z-index: 10; }
        .search-input { width: 100%; padding: 10px; border-radius: 6px; border: none; outline: none; font-size: 14px; }
        .promo { background: #f80759; color: #fff; padding: 12px; text-align: center; font-size: 13px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: #fafafa; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 8px; display: flex; flex-direction: column; flex: 1; }
        .title { font-size: 12px; color: #333; margin-bottom: 6px; height: 30px; overflow: hidden; }
        .price { font-size: 14px; font-weight: bold; color: #000; margin-bottom: 6px; }
        .btn { margin-top: auto; text-decoration: none; padding: 6px; background: #fdf2fe; border: 1px solid #9c27b0; color: #9c27b0; text-align: center; font-size: 11px; font-weight: bold; border-radius: 4px; }
        
        #login-section { display: none; background: #1f2c34; padding: 25px; border-radius: 8px; width: 90%; max-width: 320px; margin-top: 25vh; text-align: center; }
        .auth-input { width: 100%; padding: 10px; margin: 8px 0; background: #2a3942; border: 1px solid #33444d; color: #fff; border-radius: 4px; outline: none; }
        .auth-btn { width: 100%; padding: 10px; background: #00a884; border: none; color: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        #chat-section { display: none; width: 100%; max-width: 480px; height: 100vh; flex-direction: column; background: #0b141a; position: relative; }
        .wa-header { height: 60px; background: #202c33; display: flex; align-items: center; padding: 0 12px; justify-content: space-between; border-bottom: 1px solid #2a3942; }
        #messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { background: #005c4b; color: #fff; padding: 6px 10px; border-radius: 6px; max-width: 75%; align-self: flex-end; font-size: 14px; word-break: break-word; }
        .chat-footer { padding: 8px; background: #202c33; display: flex; gap: 6px; align-items: center; }
        .chat-footer input { flex: 1; padding: 8px 12px; background: #2a3942; border: none; outline: none; color: #fff; border-radius: 20px; font-size: 14px; }
        .send-btn { background: #00a884; border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="shop-view">
        <div class="top-navbar">
            <span style="font-size:18px; font-weight:bold; display:block; margin-bottom:8px;">TrendStore</span>
            <form onsubmit="handleSearch(event)">
                <input type="text" id="store-search" class="search-input" placeholder="Search or type t9..." autocomplete="off">
            </form>
        </div>
        <div class="promo">Mega Clearance Sale • Free Delivery 🔥</div>
        <div class="grid" id="product-list"></div>
    </div>

    <div id="login-section">
        <h3 style="color:#00a884; margin-bottom:12px;">Secure Sign-in</h3>
        <input type="text" id="user-input" class="auth-input" placeholder="Username (e.g. user1)">
        <input type="password" id="pass-input" class="auth-input" placeholder="Password (1717)">
        <button class="auth-btn" onclick="login()">Login</button>
        <p id="err-msg" style="color:#ff5252; font-size:11px; margin-top:8px;"></p>
    </div>

    <div id="chat-section">
        <div class="wa-header">
            <span style="font-weight:bold; font-size:16px;" id="chat-title">Chat</span>
            <div>
                <button onclick="vaultAction()" style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;" title="Vault">🗑️</button>
                <button onclick="location.reload()" style="background:none; border:none; color:#8696a0; font-size:14px; cursor:pointer; margin-left:8px;">✖</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="chat-footer">
            <input type="text" id="type-input" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const products = [
            { title: "Women Printed Anarkali Kurta", price: "₹349", source: "Meesho", img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=350&q=70" },
            { title: "Men White Casual Sneakers", price: "₹499", source: "Flipkart", img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=350&q=70" },
            { title: "Wireless Bluetooth Earbuds", price: "₹1,299", source: "Amazon", img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=350&q=70" },
            { title: "Floral Print Maxi Dress", price: "₹899", source: "Myntra", img: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=350&q=70" },
            { title: "Slim Fit Cotton Denim Jeans", price: "₹749", source: "Ajio", img: "https://images.unsplash.com/photo-1542272604-780c96856592?w=350&q=70" },
            { title: "Matte Longstay Lipstick", price: "₹299", source: "Nykaa", img: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=350&q=70" }
        ];

        function render() {
            let html = '';
            products.forEach(p => {
                const searchUrl = `https://www.google.com/search?tbm=shop&q=${encodeURIComponent(p.title + " " + p.source)}`;
                html += `<div class="card"><img src="${p.img}"><div class="card-body"><div class="title">${p.title}</div><div class="price">${p.price}</div><a href="${searchUrl}" target="_blank" class="btn">Buy Now ↗</a></div></div>`;
            });
            document.getElementById('product-list').innerHTML = html;
        }
        render();

        function handleSearch(e) {
            e.preventDefault();
            const val = document.getElementById('store-search').value.trim().toLowerCase();
            if (val === 't9') {
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('login-section').style.display = 'block';
            } else if (val) {
                window.open('https://www.google.com/search?q=' + encodeURIComponent(val), '_blank');
            }
        }

        let socket, currentUser = '';
        async function login() {
            const u = document.getElementById('user-input').value.trim();
            const p = document.getElementById('pass-input').value.trim();
            if(!u || !p) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if(data.success) {
                    currentUser = u;
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('chat-section').style.display = 'flex';
                    document.getElementById('chat-title').innerText = currentUser;
                    socket = io();
                    socket.emit('joinRoom', currentUser);
                    socket.on('message', (msg) => {
                        const box = document.getElementById('messages');
                        box.innerHTML += `<div class="msg">${msg.text}</div>`;
                        box.scrollTop = box.scrollHeight;
                    });
                } else {
                    document.getElementById('err-msg').innerText = "Incorrect Password! (Use 1717)";
                }
            } catch(err) {
                document.getElementById('err-msg').innerText = "Login failed";
            }
        }

        function sendMsg() {
            const inp = document.getElementById('type-input');
            if(!inp.value.trim()) return;
            socket.emit('chatMessage', { user: currentUser, text: inp.value });
            inp.value = '';
        }

        function vaultAction() {
            const pin = prompt("Enter Vault PIN (1717):");
            if(pin === "1717" && socket) {
                socket.emit('openDeletedBox', pin);
            } else if(pin) {
                alert("Incorrect PIN!");
            }
        }
    </script>
</body>
</html>
