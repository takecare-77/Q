<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrendStore - Fashion & Lifestyle</title>
    <meta name="theme-color" content="#9c27b0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f5f8; color: #222; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* Storefront */
        #shop-view { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding-bottom: 30px; }
        .top-navbar { background: #9c27b0; color: #fff; padding: 12px 14px; position: sticky; top: 0; z-index: 50; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brand-name { font-size: 19px; font-weight: 800; }
        .nav-icons span { margin-left: 14px; font-size: 18px; cursor: pointer; }

        .search-wrap { position: relative; width: 100%; }
        .search-input { width: 100%; padding: 10px 42px 10px 14px; border-radius: 8px; border: none; outline: none; font-size: 14px; color: #333; background: #fff; }
        .search-icon-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 4px; }

        .promo-banner { background: linear-gradient(135deg, #f80759, #bc4e9c); color: #fff; padding: 14px; text-align: center; }
        .promo-banner h3 { font-size: 15px; margin-bottom: 3px; font-weight: 700; }
        .promo-banner p { font-size: 11px; opacity: 0.95; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
        .card { background: #fff; border-radius: 8px; border: 1px solid #eaeaea; overflow: hidden; display: flex; flex-direction: column; }
        .card-img-wrap { position: relative; width: 100%; height: 160px; background: #fafafa; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .source-tag { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        
        .card-body { padding: 8px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 12px; font-weight: 500; color: #333; margin-bottom: 6px; line-height: 1.3; height: 32px; overflow: hidden; }
        .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
        .price { font-size: 14px; font-weight: bold; color: #222; }
        .old-price { font-size: 11px; text-decoration: line-through; color: #888; }
        .buy-link-btn { margin-top: auto; display: block; text-decoration: none; padding: 7px 0; background: #fdf2fe; border: 1px solid #9c27b0; border-radius: 6px; font-size: 11px; font-weight: bold; color: #9c27b0; text-align: center; }

        /* Secret Auth Screen */
        #login-section { display: none; background: #1f2c34; padding: 25px; border-radius: 10px; width: 90%; max-width: 330px; margin-top: 20vh; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #login-section h2 { font-size: 16px; text-align: center; margin-bottom: 15px; color: #00a884; }
        input.auth-input { width: 100%; padding: 12px; margin: 8px 0; background: #2a3942; border: 1px solid #33444d; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        button.auth-btn { width: 100%; padding: 12px; background: #00a884; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 6px; font-size: 14px; }

        /* Chat View */
        #chat-section { display: none; width: 100%; max-width: 500px; height: 100vh; flex-direction: column; background: #0b141a; }
        .chat-header { height: 60px; background: #202c33; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; border-bottom: 1px solid #2a3942; }
        .user-title { font-size: 15px; font-weight: 600; color: #e9edef; }
        .btn-panic { background: #d32f2f; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        #messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 82%; }
        .msg-wrapper.me { align-self: flex-end; }
        .msg-wrapper.other { align-self: flex-start; }
        .msg-bubble { padding: 8px 12px; border-radius: 8px; font-size: 14px; color: #e9edef; word-break: break-word; }
        .me .msg-bubble { background: #005c4b; }
        .other .msg-bubble { background: #202c33; }

        .chat-footer { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; }
        .input-bar { flex: 1; background: #2a3942; border-radius: 20px; padding: 10px 16px; color: #fff; border: none; outline: none; font-size: 14px; }
        .send-btn { background: #00a884; border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Shopping Storefront -->
    <div id="shop-view">
        <div class="top-navbar">
            <div class="brand-row">
                <span class="brand-name">TrendStore</span>
                <div class="nav-icons">
                    <span title="Offers">🏷️</span>
                    <span title="Cart">🛒</span>
                </div>
            </div>
            <form id="search-form" onsubmit="handleSearch(event)">
                <div class="search-wrap">
                    <input type="text" id="store-search" class="search-input" placeholder="Search Sarees, Kurtis, Shoes, Hoodies..." autocomplete="off">
                    <button type="submit" class="search-icon-btn">🔍</button>
                </div>
            </form>
        </div>

        <div class="promo-banner">
            <h3>Mega Clearance Festival 🔥</h3>
            <p>Lowest Price Guaranteed • Free Cash on Delivery</p>
        </div>

        <!-- Product Grid -->
        <div class="product-grid">
            <div class="card">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=400&q=80" alt="Kurta">
                    <span class="source-tag">Meesho</span>
                </div>
                <div class="card-body">
                    <div class="card-title">Women Printed Rayon Anarkali Kurta</div>
                    <div class="price-row">
                        <span class="price">₹349</span>
                        <span class="old-price">₹899</span>
                    </div>
                    <a href="https://www.meesho.com/search?q=rayon+anarkali+kurta" target="_blank" class="buy-link-btn">Buy on Meesho ↗</a>
                </div>
            </div>

            <div class="card">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=400&q=80" alt="Shoes">
                    <span class="source-tag">Flipkart</span>
                </div>
                <div class="card-body">
                    <div class="card-title">Men White Casual Lightweight Sneakers</div>
                    <div class="price-row">
                        <span class="price">₹499</span>
                        <span class="old-price">₹1,299</span>
                    </div>
                    <a href="https://www.flipkart.com/search?q=white+sneakers+men" target="_blank" class="buy-link-btn">Buy on Flipkart ↗</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Secret Login Box -->
    <div id="login-section">
        <h2>Identity Verification</h2>
        <input type="text" id="username" class="auth-input" placeholder="Username" autocomplete="off">
        <input type="password" id="password" class="auth-input" placeholder="Password">
        <button type="button" class="auth-btn" onclick="login()">Enter</button>
        <p id="err" style="color: #ff5252; font-size: 12px; margin-top: 8px; text-align: center;"></p>
    </div>

    <!-- Secret Chatroom -->
    <div id="chat-section">
        <div class="chat-header">
            <div class="user-title" id="user-display">Encrypted Chat</div>
            <button class="btn-panic" onclick="location.reload()">Exit</button>
        </div>
        <div id="messages"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" class="input-bar" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button type="button" class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('store-search');
            const val = input.value.trim().toLowerCase();

            if (val === 't9') {
                input.value = '';
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('login-section').style.display = 'block';
            } else if (val) {
                window.open('https://www.meesho.com/search?q=' + encodeURIComponent(val), '_blank');
            }
        }

        let socket, currentUser = '';

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = u;
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('chat-section').style.display = 'flex';
                    document.getElementById('user-display').innerText = '@' + currentUser;
                    initSocket();
                } else {
                    document.getElementById('err').innerText = data.message || 'Invalid Credentials';
                }
            } catch (err) {
                document.getElementById('err').innerText = 'Server error. Try again.';
            }
        }

        function initSocket() {
            socket = io();
            socket.emit('joinRoom', currentUser);

            socket.on('message', function(msg) {
                const isMe = msg.user === currentUser;
                const wrap = document.createElement('div');
                wrap.className = 'msg-wrapper ' + (isMe ? 'me' : 'other');
                wrap.innerHTML = '<div class="msg-bubble">' + (msg.text || '') + '</div>';
                document.getElementById('messages').appendChild(wrap);
                wrap.scrollIntoView();
            });
        }

        function sendMsg() {
            const inp = document.getElementById('msg-input');
            if (!inp.value.trim() || !socket) return;
            socket.emit('chatMessage', { user: currentUser, text: inp.value });
            inp.value = '';
        }
    </script>
</body>
</html>
