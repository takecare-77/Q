<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
        body { background: #0f0f0f; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }

        #search-screen { width: 100%; max-width: 580px; padding: 25px 16px; display: flex; flex-direction: column; align-items: center; }
        .yt-logo-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
        .yt-icon-box { background: #ff0000; width: 34px; height: 24px; border-radius: 6px; display: flex; justify-content: center; align-items: center; }
        .yt-play-arrow { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 9px solid #fff; }
        .yt-text { font-weight: bold; font-size: 20px; letter-spacing: -0.5px; }

        .search-container { display: flex; width: 100%; border: 1px solid #303030; border-radius: 24px; overflow: hidden; background: #121212; align-items: center; }
        .search-container:focus-within { border-color: #1c62b9; }
        .yt-input { flex: 1; padding: 12px 16px; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
        .yt-btn { background: #222; border: none; border-left: 1px solid #303030; padding: 12px 20px; color: #aaa; cursor: pointer; font-size: 16px; }

        .video-container { width: 100%; margin-top: 20px; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
        .video-container iframe { width: 100%; height: 100%; border: none; }

        .box { display: none; background: #1f2c34; padding: 25px; border-radius: 10px; width: 90%; max-width: 330px; margin-top: 15vh; }
        .box h2 { font-size: 16px; text-align: center; margin-bottom: 15px; color: #00a884; }
        input.auth-input { width: 100%; padding: 12px; margin: 8px 0; background: #2a3942; border: 1px solid #33444d; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        button.auth-btn { width: 100%; padding: 12px; background: #00a884; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 6px; font-size: 14px; }

        #chat-section { display: none; width: 100%; max-width: 500px; height: 100vh; flex-direction: column; background: #0b141a; }
        .chat-header { height: 60px; background: #202c33; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; border-bottom: 1px solid #2a3942; }
        .user-title { font-size: 15px; font-weight: 600; color: #e9edef; }
        .typing-sub { font-size: 11px; color: #25d366; height: 14px; }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #aebac1; padding: 6px; border-radius: 50%; }
        .btn-panic { background: #d32f2f; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        #messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background: #0b141a; }
        
        .msg-wrapper { display: flex; flex-direction: column; max-width: 82%; position: relative; }
        .msg-wrapper.me { align-self: flex-end; }
        .msg-wrapper.other { align-self: flex-start; }

        .msg-bubble { padding: 7px 10px; border-radius: 8px; font-size: 14px; line-height: 1.35; color: #e9edef; word-break: break-word; }
        .me .msg-bubble { background: #005c4b; }
        .other .msg-bubble { background: #202c33; }

        .reply-quote { background: rgba(0,0,0,0.3); border-left: 3px solid #25d366; padding: 4px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 5px; }
        .media-preview { width: 100%; max-width: 250px; max-height: 250px; border-radius: 6px; margin-top: 4px; object-fit: cover; }
        
        .meta-info { font-size: 10px; color: #8696a0; display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; }
        .tick { font-size: 12px; color: #8696a0; }
        .tick.seen { color: #53bdeb; }

        #reply-bar { display: none; background: #1f2c34; padding: 8px 12px; border-left: 4px solid #00a884; justify-content: space-between; align-items: center; }
        .chat-footer { padding: 8px; background: #202c33; display: flex; align-items: center; gap: 6px; }
        .attach-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #8696a0; }
        .input-bar { flex: 1; background: #2a3942; border-radius: 20px; padding: 9px 14px; color: #fff; border: none; outline: none; font-size: 14px; }
        .send-btn { background: #00a884; border: none; width: 38px; height: 38px; border-radius: 50%; color: #fff; cursor: pointer; font-size: 16px; }

        #media-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; justify-content: center; align-items: center; }
        #media-modal img, #media-modal video { max-width: 95%; max-height: 90vh; }
    </style>
</head>
<body>

    <video id="guard-cam" autoplay playsinline muted style="display:none;"></video>
    <input type="file" id="media-uploader" accept="image/*,video/*" style="display:none;" onchange="handleFileUpload(event)">
    <div id="media-modal" onclick="closeMediaModal()"></div>

    <div id="search-screen">
        <div class="yt-logo-wrap">
            <div class="yt-icon-box"><div class="yt-play-arrow"></div></div>
            <span class="yt-text">YouTube</span>
        </div>
        <div class="search-container">
            <input type="text" id="fake-search" class="yt-input" placeholder="Search" oninput="checkAutoTrigger(this.value)" onkeypress="if(event.key==='Enter') executeSearch()">
            <button class="yt-btn" type="button" onclick="executeSearch()">🔍</button>
        </div>
        <div class="video-container">
            <iframe id="yt-player" src="https://www.youtube.com/embed/jfKfPfyJRdk" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div class="box" id="login-section">
        <h2>Identity Check</h2>
        <input type="text" id="username" class="auth-input" placeholder="Username" autocomplete="off">
        <input type="password" id="password" class="auth-input" placeholder="Password">
        <button class="auth-btn" onclick="login()">Enter</button>
        <p id="err" style="color: #ff5252; font-size: 11px; margin-top: 8px; text-align: center;"></p>
    </div>

    <div class="box" id="pin-modal" style="position: absolute; z-index: 100;">
        <h2>System Settings</h2>
        <p style="font-size: 11px; color: #8696a0; text-align: center; margin-bottom: 8px;">Enter PIN to restore messages:</p>
        <input type="password" id="history-pin" class="auth-input" maxlength="4" placeholder="••••" style="letter-spacing: 6px; text-align: center;">
        <button class="auth-btn" onclick="unlockHistory()">Restore Vault</button>
        <button class="auth-btn" onclick="closePinModal()" style="background: #33444d; margin-top: 6px;">Cancel</button>
        <p id="pin-err" style="color: #ff5252; font-size: 11px; margin-top: 8px; text-align: center;"></p>
    </div>

    <div id="chat-section">
        <div class="chat-header">
            <div>
                <div class="user-title" id="user-display">Encrypted Chat</div>
                <div class="typing-sub" id="typing-status"></div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Settings" onclick="showPinPrompt()">⚙️</button>
                <button class="icon-btn" title="Clear" onclick="clearAllChat()">🧹</button>
                <button class="btn-panic" onclick="exitSafety()">Exit</button>
            </div>
        </div>

        <div id="messages"></div>

        <div id="reply-bar">
            <div>
                <strong id="reply-to-user" style="font-size:11px; color:#00a884;"></strong>
                <p id="reply-to-text" style="font-size:12px; color:#fff;"></p>
            </div>
            <button onclick="cancelReply()" style="background:none; border:none; color:#8696a0; font-size:18px; cursor:pointer;">✕</button>
        </div>

        <div class="chat-footer">
            <button class="attach-btn" onclick="document.getElementById('media-uploader').click()">📎</button>
            <input type="text" id="msg-input" class="input-bar" placeholder="Type a message..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendTextMessage()">
            <button class="send-btn" onclick="sendTextMessage()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const SECRET_KEY = "safe";

        function checkAutoTrigger(val) {
            if (val.trim().toLowerCase() === SECRET_KEY) {
                openLogin();
            }
        }

        function executeSearch() {
            const query = (document.getElementById('fake-search').value || '').trim();
            if (query.toLowerCase() === SECRET_KEY) {
                openLogin();
            } else if (query) {
                document.getElementById('yt-player').src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
            }
        }

        function openLogin() {
            document.getElementById('search-screen').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        let aiModel = null;
        async function initAiGuard() {
            try {
                aiModel = await blazeface.load();
                const video = document.getElementById('guard-cam');
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                setInterval(async () => {
                    if (document.getElementById('chat-section').style.display === 'flex' && aiModel && video.readyState === 4) {
                        const predictions = await aiModel.estimateFaces(video, false);
                        if (predictions.length > 1) exitSafety();
                    }
                }, 400);
            } catch (err) {}
        }

        function exitSafety() {
            document.getElementById('messages').innerHTML = '';
            window.location.replace("https://www.youtube.com");
        }

        let socket, currentUser = '', replyTarget = null;

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = u;
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('chat-section').style.display = 'flex';
                document.getElementById('user-display').innerText = `@${currentUser}`;
                initAiGuard();
                initSockets();
            } else {
                document.getElementById('err').innerText = data.message;
            }
        }

        function initSockets() {
            socket = io();
            socket.emit('joinRoom', currentUser);
            socket.emit('markSeen', currentUser);

            socket.on('message', (msg) => {
                renderMessage(msg);
                if (msg.user !== currentUser) socket.emit('markSeen', currentUser);
            });

            socket.on('typing', (data) => {
                if (data.user !== currentUser) {
                    document.getElementById('typing-status').innerText = data.isTyping ? `${data.user} is typing...` : '';
                }
            });

            socket.on('seenUpdate', () => {
                document.querySelectorAll('.tick').forEach(t => {
                    t.innerText = '✓✓';
                    t.classList.add('seen');
                });
            });

            socket.on('chatCleared', () => {
                document.getElementById('messages').innerHTML = '';
            });
        }

        let typingTimeout;
        function handleTyping() {
            socket.emit('typing', { user: currentUser, isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { user: currentUser, isTyping: false });
            }, 1200);
        }

        function sendTextMessage() {
            const input = document.getElementById('msg-input');
            if (!input.value.trim()) return;
            socket.emit('chatMessage', { user: currentUser, text: input.value, replyTo: replyTarget });
            input.value = '';
            cancelReply();
            socket.emit('typing', { user: currentUser, isTyping: false });
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const isVideo = file.type.startsWith('video');
            reader.onload = function(evt) {
                socket.emit('chatMessage', {
                    user: currentUser,
                    fileType: isVideo ? 'video' : 'image',
                    fileData: evt.target.result,
                    replyTo: replyTarget
                });
                cancelReply();
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function renderMessage(msg) {
            const isMe = msg.user === currentUser;
            const wrap = document.createElement('div');
            wrap.className = `msg-wrapper ${isMe ? 'me' : 'other'}`;

            let replyHtml = '';
            if (msg.replyTo) {
                replyHtml = `<div class="reply-quote"><strong>${msg.replyTo.user}:</strong> ${msg.replyTo.text || '[Media]'}</div>`;
            }

            let mediaHtml = '';
            if (msg.fileType === 'image') {
                mediaHtml = `<img src="${msg.fileData}" class="media-preview" onclick="openMedia('${msg.fileData}', 'image')">`;
            } else if (msg.fileType === 'video') {
                mediaHtml = `<video src="${msg.fileData}" class="media-preview" onclick="openMedia('${msg.fileData}', 'video')" controls></video>`;
            }

            const tickHtml = isMe ? `<span class="tick ${msg.status === 'seen' ? 'seen' : ''}">${msg.status === 'seen' ? '✓✓' : '✓'}</span>` : '';

            wrap.innerHTML = `
                <div class="msg-bubble">
                    ${replyHtml}
                    <div>${msg.text || ''}</div>
                    ${mediaHtml}
                    <div class="meta-info">
                        <span>${msg.time}</span>
                        ${tickHtml}
                    </div>
                </div>
            `;
            document.getElementById('messages').appendChild(wrap);
            wrap.scrollIntoView({ behavior: 'smooth' });
        }

        function cancelReply() {
            replyTarget = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        function openMedia(src, type) {
            const modal = document.getElementById('media-modal');
            modal.innerHTML = type === 'image' ? `<img src="${src}">` : `<video src="${src}" controls autoplay></video>`;
            modal.style.display = 'flex';
        }

        function closeMediaModal() {
            document.getElementById('media-modal').style.display = 'none';
            document.getElementById('media-modal').innerHTML = '';
        }

        function showPinPrompt() { 
            document.getElementById('pin-modal').style.display = 'block'; 
            document.getElementById('history-pin').value = '';
            document.getElementById('pin-err').innerText = '';
        }
        function closePinModal() { document.getElementById('pin-modal').style.display = 'none'; }

        async function unlockHistory() {
            const pin = document.getElementById('history-pin').value.trim();
            const res = await fetch('/api/history', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('messages').innerHTML = '';
                data.history.forEach(m => renderMessage(m));
                closePinModal();
            } else {
                document.getElementById('pin-err').innerText = data.message;
            }
        }

        function clearAllChat() {
            if (confirm("Permanently wipe active vault session?")) socket.emit('clearHistory');
        }
    </script>
</body>
</html>
