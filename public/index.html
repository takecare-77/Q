<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendStore - Fashion & Lifestyle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #111b21; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #shop-view { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding-bottom: 30px; color: #222; }
        .top-navbar { background: #9c27b0; color: #fff; padding: 12px; position: sticky; top: 0; z-index: 10; }
        .brand-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; display: block; }
        .search-input { width: 100%; padding: 10px; border-radius: 6px; border: none; outline: none; font-size: 14px; }
        .promo { background: #f80759; color: #fff; padding: 12px; text-align: center; font-size: 13px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: #fafafa; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 8px; display: flex; flex-direction: column; flex: 1; }
        .title { font-size: 12px; color: #333; margin-bottom: 6px; height: 30px; overflow: hidden; }
        .price { font-size: 14px; font-weight: bold; color: #000; margin-bottom: 6px; }
        .btn { margin-top: auto; text-decoration: none; padding: 6px; background: #fdf2fe; border: 1px solid #9c27b0; color: #9c27b0; text-align: center; font-size: 11px; font-weight: bold; border-radius: 4px; }
        
        #login-section { display: none; background: #1f2c34; padding: 25px; border-radius: 8px; width: 90%; max-width: 320px; margin-top: 25vh; text-align: center; }
        .auth-input { width: 100%; padding: 10px; margin: 8px 0; background: #2a3942; border: 1px solid #33444d; color: #fff; border-radius: 4px; outline: none; }
        .auth-btn { width: 100%; padding: 10px; background: #00a884; border: none; color: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        #chat-section { display: none; width: 100%; max-width: 480px; height: 100vh; flex-direction: column; background: #0b141a; }
        .wa-header { height: 55px; background: #202c33; display: flex; align-items: center; padding: 0 12px; gap: 10px; border-bottom: 1px solid #2a3942; }
        #messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { background: #005c4b; color: #fff; padding: 6px 10px; border-radius: 6px; max-width: 75%; align-self: flex-end; font-size: 14px; word-break: break-word; }
        .chat-footer { padding: 8px; background: #202c33; display: flex; gap: 6px; align-items: center; }
        .chat-footer input { flex: 1; padding: 8px 12px; background: #2a3942; border: none; outline: none; color: #fff; border-radius: 20px; font-size: 14px; }
        .send-btn { background: #00a884; border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="shop-view">
        <div class="top-navbar">
            <span class="brand-name">TrendStore</span>
            <form onsubmit="handleSearch(event)">
                <input type="text" id="store-search" class="search-input" placeholder="Search Sarees, Kurtis, Shoes, Hoodies..." autocomplete="off">
            </form>
        </div>
        <div class="promo">Mega Clearance Sale • Free Delivery 🔥</div>
        <div class="grid" id="product-list"></div>
    </div>

    <div id="login-section">
        <h3 style="color:#00a884; margin-bottom:12px;">Secure Sign-in</h3>
        <input type="text" id="user-input" class="auth-input" placeholder="Username">
        <input type="password" id="pass-input" class="auth-input" placeholder="Password">
        <button class="auth-btn" onclick="login()">Login</button>
    </div>

    <div id="chat-section">
        <div class="wa-header">
            <span style="font-weight:bold; font-size:16px;" id="chat-title">Chat</span>
            <span style="margin-left:auto; font-size:12px; color:#8696a0;" onclick="location.reload()">Exit ✖</span>
        </div>
        <div id="messages"></div>
        <div class="chat-footer">
            <input type="text" id="type-input" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Base categories with authentic images & platforms
        const categories = [
            { name: "Printed Anarkali Kurta", basePrice: 349, img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=350&q=70", src: "Meesho" },
            { name: "Casual White Sneakers", basePrice: 499, img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=350&q=70", src: "Flipkart" },
            { name: "Wireless Bluetooth Earbuds", basePrice: 1299, img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=350&q=70", src: "Amazon" },
            { name: "Floral Maxi Dress", basePrice: 899, img: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=350&q=70", src: "Myntra" },
            { name: "Slim Fit Denim Jeans", basePrice: 749, img: "https://images.unsplash.com/photo-1542272604-780c96856592?w=350&q=70", src: "Ajio" },
            { name: "Matte Longstay Lipstick", basePrice: 299, img: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=350&q=70", src: "Nykaa" },
            { name: "Bluetooth Smartwatch", basePrice: 999, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=350&q=70", src: "Amazon" },
            { name: "Silk Blend Saree", basePrice: 549, img: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=350&q=70", src: "Meesho" },
            { name: "Cotton Polo T-Shirt", basePrice: 349, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=350&q=70", src: "Ajio" },
            { name: "Laptop Backpack", basePrice: 429, img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=350&q=70", src: "Flipkart" },
            { name: "Streetwear Hoodie", basePrice: 599, img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=350&q=70", src: "Amazon" },
            { name: "Workout Leggings", basePrice: 399, img: "https://images.unsplash.com/photo-1506619216599-9d16d0903dfd?w=350&q=70", src: "Myntra" },
            { name: "UV Protected Sunglasses", basePrice: 249, img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=350&q=70", src: "Flipkart" },
            { name: "Vitamin C Face Serum", basePrice: 399, img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=350&q=70", src: "Nykaa" },
            { name: "Semi-Stitched Lehenga", basePrice: 1149, img: "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=350&q=70", src: "Meesho" },
            { name: "Solid Casual Shirt", basePrice: 499, img: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=350&q=70", src: "Ajio" },
            { name: "Insulated Water Bottle", basePrice: 449, img: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=350&q=70", src: "Amazon" },
            { name: "Block Heel Sandals", basePrice: 649, img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=350&q=70", src: "Myntra" },
            { name: "Fast Charging Power Bank", basePrice: 1099, img: "https://images.unsplash.com/photo-1609592426861-1e9d8928dbbe?w=350&q=70", src: "Flipkart" },
            { name: "Onion Hair Oil", basePrice: 249, img: "https://images.unsplash.com/photo-1608248597359-009772a806ff?w=350&q=70", src: "Nykaa" }
        ];

        const modifiers = ["Royal", "Urban", "Trendy", "Vibrant", "Chic", "Elegant", "Modish", "Stylish", "Graceful", "Fabulous"];
        const colors = ["Navy Blue", "Jet Black", "Rose Gold", "Emerald Green", "Sunset Orange", "Pearl White", "Ruby Red", "Sky Blue", "Charcoal Grey", "Ivory Cream"];

        function generateCatalog() {
            let list = [];
            let counter = 1;
            // Generates 200+ strictly unique combination products without repeating
            categories.forEach(cat => {
                modifiers.forEach((mod, mIdx) => {
                    colors.forEach((col, cIdx) => {
                        if (list.length < 220) { // Keep over 200 items
                            list.push({
                                title: `${mod} ${col} ${cat.name}`,
                                price: `₹${cat.basePrice + (counter * 7) % 300}`,
                                source: cat.src,
                                img: cat.img
                            });
                            counter++;
                        }
                    });
                });
            });
            return list;
        }

        function render() {
            const masterList = generateCatalog();
            const shuffled = [...masterList].sort(() => 0.5 - Math.random());
            let html = '';
            shuffled.forEach(p => {
                const searchUrl = `https://www.google.com/search?tbm=shop&q=${encodeURIComponent(p.title + " " + p.source)}`;
                html += `<div class="card"><img src="${p.img}" loading="lazy"><div class="card-body"><div class="title">${p.title}</div><div class="price">${p.price}</div><a href="${searchUrl}" target="_blank" class="btn">Buy Now ↗</a></div></div>`;
            });
            document.getElementById('product-list').innerHTML = html;
        }
        render();

        function handleSearch(e) {
            e.preventDefault();
            const val = document.getElementById('store-search').value.trim().toLowerCase();
            if (val === 't9') {
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('login-section').style.display = 'block';
            } else if (val) {
                window.open('https://www.google.com/search?q=' + encodeURIComponent(val), '_blank');
            }
        }

        let socket, currentUser = '';
        function login() {
            currentUser = document.getElementById('user-input').value.trim();
            if(!currentUser) return;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';
            document.getElementById('chat-title').innerText = currentUser;
            socket = io();
            socket.emit('joinRoom', currentUser);
            socket.on('message', (msg) => {
                const box = document.getElementById('messages');
                box.innerHTML += `<div class="msg">${msg.text}</div>`;
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            const inp = document.getElementById('type-input');
            if(!inp.value.trim()) return;
            socket.emit('chatMessage', { user: currentUser, text: inp.value });
            inp.value = '';
        }
    </script>
</body>
</html>
